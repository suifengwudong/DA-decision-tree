name: Release to Typst Package Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Your fork of typst/packages (https://github.com/typst/packages)
  # Make sure you have push access to this repository.
  # Set the REGISTRY_TOKEN secret to a PAT with write access to REGISTRY_REPO.
  REGISTRY_REPO: suifengwudong/packages
  # Path prefix within the registry repo — keep as-is for the Typst preview registry
  PATH_PREFIX: packages/preview

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract package metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("typst.toml").read_text(encoding="utf-8"))
          pkg = data["package"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PKG_NAME={pkg['name']}\n")
              f.write(f"PKG_VERSION={pkg['version']}\n")
          PY

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]]; then
            echo "Package version ${PKG_VERSION} does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Assemble package directory
        run: |
          set -euo pipefail
          PKG_DIR="out/${PKG_NAME}/${PKG_VERSION}"
          mkdir -p "${PKG_DIR}"
          # Required files
          cp typst.toml lib.typ "${PKG_DIR}/"
          # Recommended files — copy only if they exist
          for f in README.md LICENSE CHANGELOG.md; do
            if [[ -f "${f}" ]]; then
              cp "${f}" "${PKG_DIR}/"
            else
              echo "Warning: ${f} not found, skipping"
            fi
          done

      - name: Checkout package registry fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REGISTRY_REPO }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: typst-packages

      - name: Push package to registry fork
        run: |
          set -euo pipefail

          BRANCH="${PKG_NAME}-${PKG_VERSION}"
          TARGET_PARENT="typst-packages/${PATH_PREFIX}/${PKG_NAME}"
          TARGET_DIR="${TARGET_PARENT}/${PKG_VERSION}"

          if [[ -e "${TARGET_DIR}" ]]; then
            echo "Target already exists in registry fork: ${TARGET_DIR}" >&2
            exit 1
          fi

          mkdir -p "${TARGET_PARENT}"
          mv "out/${PKG_NAME}/${PKG_VERSION}" "${TARGET_PARENT}/"

          GIT_USER_NAME="$(git log -1 --pretty=format:'%an')"
          GIT_USER_EMAIL="$(git log -1 --pretty=format:'%ae')"

          cd typst-packages

          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"

          if ! git fetch origin "${DEFAULT_BRANCH}"; then
            DEFAULT_BRANCH=main
            git fetch origin "${DEFAULT_BRANCH}" || (DEFAULT_BRANCH=master && git fetch origin "${DEFAULT_BRANCH}")
          fi

          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          git checkout -b "${BRANCH}"
          git add .
          git commit -m "${PKG_NAME}:${PKG_VERSION}"
          git push --set-upstream origin "${BRANCH}"

      - name: Job summary
        run: |
          set -euo pipefail
          {
            echo "## Typst registry publish"
            echo ""
            echo "- Package: \`${PKG_NAME}\`"
            echo "- Version: \`${PKG_VERSION}\`"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            if [[ -n "${PR_URL:-}" ]]; then
              echo "- PR: ${PR_URL}"
            else
              echo "- PR: (not created)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
